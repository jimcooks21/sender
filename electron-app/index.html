<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:3003; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<title>MASS_SENDER</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#0f0f13;color:#e2e2e2;display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ─ header ─ */
  header{background:#141420;border-bottom:1px solid #2a2a40;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  header h1{font-size:15px;font-weight:600;color:#fff;letter-spacing:.5px;flex:1}
  #status-dot{width:10px;height:10px;border-radius:50%;background:#555;transition:background .3s}
  #status-dot.running{background:#22c55e;box-shadow:0 0 8px #22c55e80}
  #btn-run{padding:6px 18px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:#22c55e;color:#000;transition:all .2s}
  #btn-run.stop{background:#ef4444;color:#fff}
  #btn-dash{padding:6px 14px;border-radius:6px;border:1px solid #2a2a40;background:#1a1a2e;color:#aaa;cursor:pointer;font-size:12px}
  #btn-dash:hover{border-color:#5865f2;color:#fff}

  /* ─ tabs ─ */
  nav{background:#141420;border-bottom:1px solid #2a2a40;display:flex;flex-shrink:0}
  nav button{padding:9px 18px;border:none;background:none;color:#888;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;transition:all .2s}
  nav button.active{color:#fff;border-bottom-color:#5865f2}
  nav button:hover:not(.active){color:#ccc}

  /* ─ panels ─ */
  .panel{display:none;flex:1;overflow:hidden;flex-direction:column}
  .panel.active{display:flex}

  /* ─ editors ─ */
  .editor-wrap{display:flex;flex-direction:column;flex:1;padding:14px;gap:10px;overflow:hidden}
  .editor-wrap label{font-size:12px;color:#888;font-weight:500}
  textarea{flex:1;background:#111118;border:1px solid #2a2a40;border-radius:8px;color:#e2e2e2;font-family:'Consolas','Fira Code',monospace;font-size:13px;padding:12px;resize:none;outline:none;transition:border .2s}
  textarea:focus{border-color:#5865f2}
  .save-row{display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
  .btn-save{padding:6px 20px;border-radius:6px;border:none;background:#5865f2;color:#fff;cursor:pointer;font-size:13px;font-weight:600}
  .btn-save:hover{background:#4752c4}
  .msg{font-size:12px;color:#22c55e;opacity:0;transition:opacity .4s}
  .msg.visible{opacity:1}

  /* ─ cert panel ─ */
  #cert-decoded{flex:1;border:1px solid #2a2a40;border-radius:8px;overflow:hidden}
  #cert-decoded iframe{width:100%;height:100%;border:none;background:#fff}

  /* ─ dashboard iframe ─ */
  #dash-frame{flex:1;border:1px solid #2a2a40;border-radius:8px;overflow:hidden}
  #dash-frame iframe{width:100%;height:100%;border:none}

  /* ─ logs ─ */
  #log-box{flex:1;background:#080810;border:1px solid #2a2a40;border-radius:8px;overflow-y:auto;padding:10px 14px;font-family:'Consolas',monospace;font-size:12px;color:#a0f0a0}
  .log-entry{white-space:pre-wrap;word-break:break-all;line-height:1.5}
  .log-entry.err{color:#f87171}
</style>
</head>
<body>

<header>
  <span id="status-dot"></span>
  <h1>MASS_SENDER — Email Campaign Manager</h1>
  <button id="btn-dash" onclick="openDash()">Open Dashboard ↗</button>
  <button id="btn-run" onclick="toggleRun()">▶ Start Sender</button>
</header>

<nav>
  <button class="active" onclick="showTab('tab-emails',this)">Recipients</button>
  <button onclick="showTab('tab-body',this)">Email Body</button>
  <button onclick="showTab('tab-cert',this)">Certificate</button>
  <button onclick="showTab('tab-dash',this)">Dashboard</button>
  <button onclick="showTab('tab-logs',this)">Logs</button>
</nav>

<!-- Recipients -->
<div id="tab-emails" class="panel active">
  <div class="editor-wrap">
    <label>emails.txt — one email address per line</label>
    <textarea id="txt-emails" placeholder="Loading..."></textarea>
    <div class="save-row">
      <span id="msg-emails" class="msg">Saved!</span>
      <button class="btn-save" onclick="saveFile('emails','txt-emails','msg-emails')">Save</button>
    </div>
  </div>
</div>

<!-- Email Body -->
<div id="tab-body" class="panel">
  <div class="editor-wrap">
    <label>email_body.html — use {{CERT_URL}} and {{PIXEL_URL}} placeholders</label>
    <textarea id="txt-body" placeholder="Loading..."></textarea>
    <div class="save-row">
      <span id="msg-body" class="msg">Saved!</span>
      <button class="btn-save" onclick="saveFile('body','txt-body','msg-body')">Save</button>
    </div>
  </div>
</div>

<!-- Certificate -->
<div id="tab-cert" class="panel">
  <div class="editor-wrap">
    <label>cert.b64 — base64-encoded HTML certificate (edit or preview below)</label>
    <textarea id="txt-cert" style="max-height:160px" placeholder="Loading..."></textarea>
    <div class="save-row">
      <span id="msg-cert" class="msg">Saved!</span>
      <button class="btn-save" onclick="saveCert()">Save &amp; Preview</button>
    </div>
    <div id="cert-decoded"><iframe id="cert-frame" title="Certificate preview"></iframe></div>
  </div>
</div>

<!-- Dashboard -->
<div id="tab-dash" class="panel">
  <div class="editor-wrap" style="padding:0;gap:0">
    <div id="dash-frame"><iframe id="dash-iframe" src="http://localhost:3003/dashboard" title="Dashboard"></iframe></div>
  </div>
</div>

<!-- Logs -->
<div id="tab-logs" class="panel">
  <div class="editor-wrap">
    <label>Live output from send_mass.js</label>
    <div id="log-box"></div>
    <div class="save-row">
      <button class="btn-save" style="background:#1a1a2e;border:1px solid #2a2a40;color:#aaa" onclick="clearLogs()">Clear</button>
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let running = false;

// ── Boot ──────────────────────────────────────────────────────────────────────
(async () => {
  const r = await window.api.isRunning();
  running = r.running;
  updateRunBtn();

  // Load all editable files
  loadFile('emails', 'txt-emails');
  loadFile('body',   'txt-body');
  loadFile('cert',   'txt-cert');
  renderCert();
})();

// ── Tab switching ─────────────────────────────────────────────────────────────
function showTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if (id === 'tab-dash') {
    // Reload dashboard iframe
    const iframe = document.getElementById('dash-iframe');
    iframe.src = iframe.src;
  }
}

// ── File load/save ─────────────────────────────────────────────────────────────
async function loadFile(key, textareaId) {
  const res = await window.api.readFile(key);
  if (res.ok) document.getElementById(textareaId).value = res.content;
  else document.getElementById(textareaId).value = '// Error: ' + res.error;
}

async function saveFile(key, textareaId, msgId) {
  const content = document.getElementById(textareaId).value;
  const res = await window.api.writeFile(key, content);
  const msgEl = document.getElementById(msgId);
  if (res.ok) {
    msgEl.textContent = 'Saved!';
    msgEl.style.color = '#22c55e';
  } else {
    msgEl.textContent = 'Error: ' + res.error;
    msgEl.style.color = '#ef4444';
  }
  msgEl.classList.add('visible');
  setTimeout(() => msgEl.classList.remove('visible'), 2000);
}

async function saveCert() {
  await saveFile('cert', 'txt-cert', 'msg-cert');
  renderCert();
}

function renderCert() {
  const b64 = document.getElementById('txt-cert').value.trim();
  try {
    const html = atob(b64);
    const blob = new Blob([html], { type: 'text/html' });
    document.getElementById('cert-frame').src = URL.createObjectURL(blob);
  } catch {
    // invalid base64 — show nothing
  }
}

// Also render cert when user pastes/types
document.getElementById('txt-cert').addEventListener('input', () => {
  clearTimeout(window._certTimer);
  window._certTimer = setTimeout(renderCert, 800);
});

// ── Run / Stop ────────────────────────────────────────────────────────────────
async function toggleRun() {
  if (running) {
    const r = await window.api.stopSender();
    if (r.ok) { running = false; updateRunBtn(); }
    else alert('Stop failed: ' + r.error);
  } else {
    const r = await window.api.startSender();
    if (r.ok) { running = true; updateRunBtn(); showTab('tab-logs', document.querySelectorAll('nav button')[4]); }
    else alert('Start failed: ' + r.error);
  }
}

function updateRunBtn() {
  const btn = document.getElementById('btn-run');
  const dot = document.getElementById('status-dot');
  if (running) {
    btn.textContent = '■ Stop Sender';
    btn.classList.add('stop');
    dot.classList.add('running');
  } else {
    btn.textContent = '▶ Start Sender';
    btn.classList.remove('stop');
    dot.classList.remove('running');
  }
}

window.api.onStopped((code) => {
  running = false;
  updateRunBtn();
  appendLog('[Process exited with code ' + code + ']');
});

// ── Logs ──────────────────────────────────────────────────────────────────────
window.api.onLog((msg) => appendLog(msg));

function appendLog(msg) {
  const box  = document.getElementById('log-box');
  const div  = document.createElement('div');
  div.className = 'log-entry' + (msg.startsWith('[ERR]') ? ' err' : '');
  div.textContent = msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function clearLogs() {
  document.getElementById('log-box').innerHTML = '';
}

// ── Dashboard ──────────────────────────────────────────────────────────────────
function openDash() {
  window.api.openDashboard();
}
</script>
</body>
</html>
